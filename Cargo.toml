[package]
name = "rasterwave"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["boybook"]
description = "High-performance streaming SSTV and radiofax encoder/decoder"
license = "MIT"
repository = "https://github.com/boybook/rasterwave.rs"
homepage = "https://github.com/boybook/rasterwave.rs"
documentation = "https://docs.rs/rasterwave"
readme = "README.md"
keywords = ["sstv", "radiofax", "wefax", "ham-radio", "codec"]
categories = ["multimedia::encoding", "science"]
exclude = [".github/"]

[dependencies]
thiserror = "2.0"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
static_assertions = "1.1"

[[bench]]
name = "codec"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
